name: Full replace repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-replace.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild latest project and replace repository
        shell: bash
        run: |
          set -euo pipefail

          cat _repo_update/part-*.b64 | base64 --decode > /tmp/urlshorter-latest.zip
          mkdir -p /tmp/urlshorter-latest
          unzip -q /tmp/urlshorter-latest.zip -d /tmp/urlshorter-latest

          PROJECT_ROOT="/tmp/urlshorter-latest/urlshorter-cf-updated"
          test -d "$PROJECT_ROOT"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$PROJECT_ROOT"/. .

          # Never publish local secrets.
          rm -f .dev.vars

          git config user.name "Madoa5561"
          git config user.email "81414605+Madoa5561@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace repository with latest Cloudflare Workers version"
          git push origin HEAD:main
